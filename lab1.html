    <script>

        


function addition(a , b){
    return a+b;
}

function bitwiseAND(a , b){
    return a & b;
}

function bitwiseOR(a , b){
    return a | b;
}

function bitwiseXOR(a , b){
    return a ^ b;
}

function addUp(a){
    let sum = 0;
    for(let i = 1; i<=a; i++){
            sum = sum  + i;
    }
    return sum;
}

function progressBar(a){
    let s = "";
    let b = Math.floor(a/10);
    for(let i = 1; i<=10;i++){
        if(i<=b){
            s = s + '#';
        }else{
            s = s + '_';
        }
    }
    return s;

}

function minMax(a){
    let min = a[0];
    let max = a[0];
    
    for(let i = 1; i< a.length(); i++){
            if(a[i]<min){
                min = a[i];
            }
            if(a[i]>max){
                max = a[i];
            }
    }
    return [min , max];

}

const repos = [{name : 'repo-a' , stars : 12} , {name : 'repo-b' , stars : 45}];

function calculateRepoStats(r){
    let stars = r.map(r => r.stars)
    let maxStars = Math.max(...stars);
    let minStars = Math.min(...stars);
   
    
    let sum = addUp(stars);
    let average = sum/r.length;
    let difference = maxStars-minStars;
    

    return{ maxStars: maxStars , minStars: minStars , average: average , difference: difference};
}

calculateRepoStats(repos);


function calculateFinalPrice(basePrice, taxRate, discountPercentage){
  let discountedPrice = basePrice - (basePrice * discountPercentage / 100);
  let tax = discountedPrice * taxRate / 100;
  let finalPrice = discountedPrice + tax;
  finalPrice = Math.round(finalPrice * 100) / 100;
  let loyaltyPoints = Math.floor(finalPrice);
  return { finalPrice: finalPrice, loyaltyPoints: loyaltyPoints };
}


function paginatedData(items, pageNumber, pageSize){
  if(!pageSize) pageSize = 5;
  let totalPages = Math.ceil(items.length / pageSize);
  let start = (pageNumber - 1) * pageSize;
  let end = start + pageSize;
  return {
    data: items.slice(start, end),
    currentPage: pageNumber,
    totalPages: totalPages,
    hasNext: pageNumber < totalPages,
    hasPrev: pageNumber > 1
  };
}
